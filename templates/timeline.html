<!DOCTYPE html>
<html>
<head>
    <title>Application Timeline</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            padding: 40px;
        }

        .navbar {
            background-color: #111;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .navbar h2 {
            color: #00bfff;
        }

        .back-btn {
            background-color: #00bfff;
            color: black;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            margin-top: 40px;
            max-width: 800px;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
            border-left: 3px solid #00bfff;
        }

        .step {
            margin-bottom: 40px;
            position: relative;
        }

        .step::before {
            content: "";
            position: absolute;
            left: -11px;
            top: 5px;
            width: 18px;
            height: 18px;
            background-color: #00bfff;
            border-radius: 50%;
        }

        .action {
            font-weight: bold;
            font-size: 16px;
            color: #00bfff;
        }

        .time {
            font-size: 13px;
            color: #ccc;
            margin-top: 5px;
        }

        .card {
            background-color: #111;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .no-data {
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Application Timeline</h2>
        <a href="/citizen_dashboard" class="back-btn">Back</a>
    </div>

    <div class="container">

        {% if logs %}
        <div class="timeline">
            {% for log in logs %}
            <div class="step">
                <div class="card">
                    <div class="action">{{ log[0] }}</div>
                    <div class="time">{{ log[1] }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
            <p class="no-data">No timeline data available.</p>
        {% endif %}

    </div>

</body>
</html>
